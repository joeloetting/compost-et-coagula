  # (A hourglass, B half disc, C# diamond, G# si), so the key is A major.
  key: { tonic: A, mode: major }
  meter: '4/4'
  # Read from the author's scan of page 47. The tenor is the third of four
  # staves and carries the melody; verse 1 is printed above it. The treble
  # and counter open with a half-note upbeat while the tenor rests; the
  # tenor's first note is read as "Come", which leaves the beamed pair as
  # the line's one melisma, as the syllable count requires.
  notes:
    - { pitch: A4, dur: quarter, syl: 'Come,', sourceHead: swan-do }
    - { pitch: A4, dur: quarter, syl: let, sourceHead: swan-do }
    - { pitch: A4, dur: eighth, syl: us, sourceHead: swan-do }
    - { pitch: B4, dur: eighth, continues: true, sourceHead: swan-ra }
    - { pitch: C#5, dur: quarter, syl: use, sourceHead: swan-mi }
    - { pitch: B4, dur: quarter, syl: the, sourceHead: swan-ra }
    - { pitch: B4, dur: quarter, syl: grace, sourceHead: swan-ra }
    - { pitch: B4, dur: quarter, syl: di-, sourceHead: swan-ra }
    - { pitch: G#4, dur: quarter, syl: 'vine,', sourceHead: swan-si }
  spans:
    - { kind: beam, from: 3, to: 4 }
  tune: { composer: Miss M. Durham (as printed) }
  words: { author: Charles Wesley, firstLine: 'Come, let us use the grace divine' }
  arrangement: 'Counter by M. L. Swan, and chorus noted (as printed: "Counter by Swan, and Chorus noted")'
  source:
    tunebook: The New Harp of Columbia
    compiler: M. L. Swan
    edition: 'Nashville: Publishing House of the M. E. Church, South'
    year: 1919
    page: 47
    tune: The Promised Land
    voice: tenor
    verse: 1
    locator: first line
  editorial:
    - Pitches as printed in the treble clef; tenors sing them an octave lower.
    - The page prints no key signature; the key is read from the shapes.
    - The beamed pair of eighths is sung to one syllable, as printed.
    - The words are printed once, between the counter and the tenor; their placement under the tenor's notes is read from the syllable count.

