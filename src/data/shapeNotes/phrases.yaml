# Musical phrases for shape-note dividers (<ShapeNoteDivider ref="..." />).
# The fields are documented in README.md under "Shape-note dividers", and
# checked by the `shapeNotes` collection in src/content.config.ts.
#
# Pitches are written as they stand in the source (scientific pitch names,
# middle C = C4); durations are in quarter notes. Shapes are worked out from
# the key, never written by hand.
#
# Records marked `fixture: true` are demonstration data: synthetic phrases,
# or a real phrase with a placeholder citation. They must not appear in a
# published article, and `npm test` fails if one is used on a published page.
# To publish Idumea, replace its placeholder source with the real tunebook,
# edition, year, and page, and remove `fixture: true`.

- id: idumea-opening
  # The notes and words are real; the citation below is a placeholder.
  fixture: true
  title: Idumea
  notation: four-shape
  key: { tonic: A, mode: minor } # "Flat Key on A"
  meter: '3/2'
  voice: tenor
  # Read from the author's scan of a four-part printing (heading "IDUMEA. S.M.
  # Flat Key on A."). Every shape agrees with the key, and the pitches agree
  # with the incipit hymnary.org gives for IDUMEA.
  notes:
    - { pitch: A4, dur: 2, syl: My }
    - { pitch: A4, dur: 4, syl: 'God,' }
    - { pitch: G4, dur: 1, syl: my }
    - { pitch: A4, dur: 1, syl: 'life,' }
    - { pitch: C5, dur: 4, syl: my }
    - { pitch: D5, dur: 1, syl: love }
    - { pitch: C5, dur: 1 }
  tune: { composer: Ananias Davisson (attributed) }
  words: { author: Isaac Watts, firstLine: 'My God, my life, my love' }
  source:
    # PLACEHOLDER CITATION for the demo: an invented title, not a real book.
    title: The Example Harmony
    edition: demonstration edition
    year: 1844
    page: 47
  editorial:
    - 'Excerpt: the first line of the tenor, which carries the melody.'
    - Pitches as printed in the treble clef; men sing them an octave lower.

