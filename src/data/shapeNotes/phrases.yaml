# Musical phrases for shape-note dividers (<ShapeNoteDivider ref="..." />).
# The fields are documented in README.md under "Shape-note dividers", and
# checked by the `shapeNotes` collection in src/content.config.ts.
#
# Each phrase is a staffless adaptation of one cited voice: its notes and its
# words both come from that voice, in the verse named. `system` names the
# tunebook's own shape system (fasola-four or swan-seven); shapes are worked
# out from the key and each pitch's letter, never written by hand and never
# converted between systems. `sourceHead`, where given, is the head printed
# in the source, and the build fails if the key gives a different one.
#
# Pitches are written as they stand in the source (scientific pitch names,
# middle C = C4). Durations are written note values: `half`, or
# { value: quarter, dots: 1 }, or { value: eighth, tuplet: { actual: 3, normal: 2 } }.
# A note sung to the previous syllable says `continues: true`; slurs, ties,
# and beams printed in the source go in `spans`, counting notes from 1.
#
# `passageId` names the notated passage a phrase quotes (one arrangement,
# voice, and place in the tune), so that records setting the same notes to
# different verses share it. It is not a tune title; a phrase without one is
# its own passage. `npm run phrase:draw -- --distinct-passages` uses it.
#
# Records marked `fixture: true` are demonstration data: synthetic phrases,
# or a phrase whose citation is incomplete or a placeholder. They must not
# appear in a published article, and `npm test` fails if one is used on a
# published page.

- id: old-hundred-tenor
  title: Old Hundred
  passageId: new-harp-1919-old-hundred-tenor-line-1
  system: swan-seven
  key: { tonic: A, mode: major } # three sharps; do on A
  meter: '2/2'
  # Read from the author's scan of page 11. The tenor is the third of four
  # staves and carries the melody; verse 3 is printed under it.
  notes:
    - { pitch: A4, dur: half, syl: "We'll", sourceHead: swan-do }
    - { pitch: A4, dur: half, syl: crowd, sourceHead: swan-do }
    - { pitch: G#4, dur: half, syl: thy, sourceHead: swan-si }
    - { pitch: F#4, dur: half, syl: gates, sourceHead: swan-la }
    - { pitch: E4, dur: half, syl: with, sourceHead: swan-sol }
    - { pitch: A4, dur: half, syl: thank-, sourceHead: swan-do }
    - { pitch: B4, dur: half, syl: ful, sourceHead: swan-ra }
    - { pitch: C#5, dur: half, syl: 'songs,', sourceHead: swan-mi }
  tune: { composer: M. Luther (as printed) }
  words: { author: Isaac Watts, firstLine: "Before Jehovah's awful throne" }
  source:
    tunebook: The New Harp of Columbia
    compiler: M. L. Swan
    edition: 'Nashville: Publishing House of the M. E. Church, South'
    year: 1919
    page: 11
    tune: Old Hundred
    voice: tenor
    verse: 3
    locator: first line
  editorial:
    - Pitches as printed in the treble clef; tenors sing them an octave lower.
    - The hold over the last note is not drawn.

- id: old-hundred-tenor-verse-1
  title: Old Hundred
  passageId: new-harp-1919-old-hundred-tenor-line-1
  system: swan-seven
  key: { tonic: A, mode: major } # three sharps; do on A
  meter: '2/2'
  # The same tenor notes as old-hundred-tenor, from the author's scan of page
  # 11, sung to verse 1. The book prints verse 1 under the top staff and
  # verse 3 under the tenor; every voice sings every verse to its own notes.
  notes:
    - { pitch: A4, dur: half, syl: Be-, sourceHead: swan-do }
    - { pitch: A4, dur: half, syl: fore, sourceHead: swan-do }
    - { pitch: G#4, dur: half, syl: Je-, sourceHead: swan-si }
    - { pitch: F#4, dur: half, syl: ho-, sourceHead: swan-la }
    - { pitch: E4, dur: half, syl: "vah's", sourceHead: swan-sol }
    - { pitch: A4, dur: half, syl: aw-, sourceHead: swan-do }
    - { pitch: B4, dur: half, syl: ful, sourceHead: swan-ra }
    - { pitch: C#5, dur: half, syl: 'throne,', sourceHead: swan-mi }
  tune: { composer: M. Luther (as printed) }
  words: { author: "Isaac Watts (1719), altered by John Wesley (1737)", firstLine: "Before Jehovah's awful throne" }
  source:
    tunebook: The New Harp of Columbia
    compiler: M. L. Swan
    edition: 'Nashville: Publishing House of the M. E. Church, South'
    year: 1919
    page: 11
    tune: Old Hundred
    voice: tenor
    verse: 1
    locator: first line
  editorial:
    - Pitches as printed in the treble clef; tenors sing them an octave lower.
    - The words of verse 1 are printed under the top staff and set here to the tenor's notes.
    - The hold over the last note is not drawn.
    - '"Before Jehovah''s awful throne" is Wesley''s alteration of Watts''s second stanza, first printed in his Collection of Psalms and Hymns (Charlestown, 1737).'

- id: liverpool-tenor
  # Notes, words, and shapes are checked against the scan. The page number
  # below is a PLACEHOLDER for the demo, not read from the book, so the
  # phrase stays a fixture and cannot be published until it is replaced.
  fixture: true
  title: Liverpool
  system: fasola-four
  key: { tonic: F, mode: major } # one flat; fa on F
  # Read from the author's scan. The tenor is the middle of three staves and
  # carries the melody; the words under it are the second half of verse 1.
  notes:
    - { pitch: F4, dur: half, syl: Re-, sourceHead: fasola-fa }
    - { pitch: F4, dur: eighth, syl: mem-, sourceHead: fasola-fa }
    - { pitch: G4, dur: eighth, continues: true, sourceHead: fasola-sol }
    - { pitch: A4, dur: quarter, syl: ber, sourceHead: fasola-la }
    - { pitch: C5, dur: half, syl: you, sourceHead: fasola-sol }
    - { pitch: D5, dur: half, syl: are, sourceHead: fasola-la }
    - { pitch: C5, dur: quarter, syl: hast’-, sourceHead: fasola-sol }
    - { pitch: A4, dur: eighth, syl: ning, sourceHead: fasola-la }
    - { pitch: G4, dur: eighth, continues: true, sourceHead: fasola-sol }
    - { pitch: F4, dur: half, syl: 'on', sourceHead: fasola-fa }
  spans:
    - { kind: beam, from: 2, to: 3 }
    - { kind: beam, from: 8, to: 9 }
  tune: { composer: M. C. H. Davis (as printed) }
  words: { firstLine: 'Young people all, attention give' }
  source:
    tunebook: The Southern Harmony, and Musical Companion
    compiler: William Walker
    edition: 'new edition, thoroughly revised and much enlarged (Philadelphia: E. W. Miller)'
    year: 1854
    page: 23 # PLACEHOLDER: not the real page
    tune: Liverpool
    voice: tenor
    verse: 1
    locator: fifth line of the verse
  editorial:
    - Pitches as printed in the treble clef; tenors sing them an octave lower.
    - Each pair of beamed eighths is sung to one syllable, as printed.

- id: idumea-opening
  # The notes and words are real; the citation below is a placeholder.
  fixture: true
  title: Idumea
  system: fasola-four
  key: { tonic: A, mode: minor } # "Flat Key on A"
  meter: '3/2'
  # Read from the author's scan of a four-part printing (heading "IDUMEA. S.M.
  # Flat Key on A."). Every shape agrees with the key, and the pitches agree
  # with the incipit hymnary.org gives for IDUMEA.
  notes:
    - { pitch: A4, dur: half, syl: My }
    - { pitch: A4, dur: whole, syl: 'God,' }
    - { pitch: G4, dur: quarter, syl: my }
    - { pitch: A4, dur: quarter, syl: 'life,' }
    - { pitch: C5, dur: whole, syl: my }
    - { pitch: D5, dur: quarter, syl: love }
    - { pitch: C5, dur: quarter, continues: true }
  tune: { composer: Ananias Davisson (attributed) }
  words: { author: Isaac Watts, firstLine: 'My God, my life, my love' }
  source:
    # PLACEHOLDER CITATION for the demo: an invented title, not a real book.
    tunebook: The Example Harmony
    edition: demonstration edition
    year: 1844
    page: 47
    tune: Idumea
    voice: tenor
    verse: 1
    locator: first line
  editorial:
    - Pitches as printed in the treble clef; men sing them an octave lower.

