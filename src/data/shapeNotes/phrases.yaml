# Musical phrases for shape-note dividers (<ShapeNoteDivider ref="..." />).
# The fields are documented in README.md under "Shape-note dividers", and
# checked by the `shapeNotes` collection in src/content.config.ts.
#
# Pitches are written as they stand in the source (scientific pitch names,
# middle C = C4); durations are in quarter notes. Shapes are worked out from
# the key, never written by hand.
#
# The two records below are SYNTHETIC TEST DATA. Their notes and words were
# written for this site to exercise the component; they are not a historical
# tune and must not appear in a published article. `npm test` fails if a
# fixture is used on any published page. A historical phrase such as Idumea
# goes here only once its notes, rhythm and words have been checked against a
# public-domain printing, with the source fields filled in.

- id: fixture-minor-phrase
  fixture: true
  title: Synthetic test phrase (minor)
  notation: four-shape
  key: { tonic: A, mode: minor }
  meter: '3/2'
  voice: melody
  notes:
    - { pitch: A3, dur: 2, syl: These }
    - { pitch: A3, dur: 2, syl: notes }
    - { pitch: C4, dur: 2, syl: are }
    - { pitch: B3, dur: 2, syl: a }
    - { pitch: E4, dur: 4, syl: test }
    - { rest: 2 }
    - { pitch: D4, dur: 2, syl: and }
    - { pitch: C4, dur: 1, syl: not }
    - { pitch: B3, dur: 1 }
    - { pitch: G#3, dur: 2, syl: a }
    - { pitch: A3, dur: 4, syl: hymn. }
  source:
    title: Synthetic test data
  editorial:
    - Not a historical tune; tests a minor key, a rest, a slur, and the raised seventh.

- id: fixture-long-lyric
  fixture: true
  title: Synthetic test phrase (long lyric)
  notation: four-shape
  key: { tonic: G, mode: major }
  meter: '4/4'
  voice: melody
  notes:
    - { pitch: D4, dur: 1, syl: Long }
    - { pitch: G4, dur: 0.5, syl: 'words,' }
    - { pitch: A4, dur: 0.5, syl: then }
    - { pitch: B4, dur: 1.5, syl: long- }
    - { pitch: A4, dur: 0.5, syl: er }
    - { pitch: G4, dur: 1, syl: 'ones,' }
    - { pitch: F#4, dur: 1, syl: test }
    - { pitch: E4, dur: 0.5, syl: how }
    - { pitch: G4, dur: 0.5, syl: the }
    - { pitch: B4, dur: 1, syl: lyr- }
    - { pitch: D5, dur: 1, syl: ic }
    - { pitch: C5, dur: 0.5, syl: wraps }
    - { pitch: A4, dur: 0.5, syl: on }
    - { pitch: F#4, dur: 0.5, syl: nar- }
    - { pitch: E4, dur: 0.5, syl: row }
    - { pitch: G4, dur: 2, syl: screens. }
  source:
    title: Synthetic test data
  editorial:
    - Not a historical tune; tests a long lyric, eighth notes, and a major key.
